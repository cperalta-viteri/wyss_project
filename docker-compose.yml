version: "3.9"

services:
  jupyter:
    image: nsv2
    build:
      context: "./container"
    platform: "linux/amd64"
    ports:
      - "8888:8888"
    #environment:
    #- PASSWORD: "my_secret"
    volumes:
      - ./.rstudio_config:/home/rstudio/.config/rstudio
      - ./:/home/rstudio/workdir
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped