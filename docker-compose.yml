version: "3.9"

services:
  rstudio:
    image: unigebsp/neurosuite
    build:
      context: "./container"
      platforms:
        - "linux/arm64"
        - "linux/amd64"
    ports:
      - "8787:8787" # Rstudio UI
      #  - "3838:3838"  # Shiny server
    environment:
      - PASSWORD: my_secret
    volumes:
      - ./:/home/rstudio
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
